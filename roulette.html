<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids Roulette Picker</title>

<style>
    body{
        font-family: Arial, sans-serif;
        text-align:center;
        background:#f0f8ff;
        margin:0;
        padding:20px;
    }

    h1{
        color:#333;
    }

    .container{
        display:grid;
        grid-template-columns: repeat(2, 1fr);
        gap:20px;
        max-width:700px;
        margin:auto;
    }

    .box{
        background:white;
        padding:15px;
        border-radius:15px;
        box-shadow:0 0 10px rgba(0,0,0,0.2);
    }

    textarea{
        width:90%;
        height:120px;
        font-size:16px;
        margin-top:10px;
    }

    #wheelContainer{
        margin-top:30px;
    }

    canvas{
        background:white;
        border-radius:50%;
        box-shadow:0 0 10px rgba(0,0,0,0.3);
    }

    button{
        margin-top:20px;
        padding:12px 30px;
        font-size:20px;
        border:none;
        border-radius:10px;
        background:#4CAF50;
        color:white;
        cursor:pointer;
    }

    button:hover{
        background:#45a049;
    }

    #winner{
        margin-top:20px;
        font-size:28px;
        color:#d63384;
        font-weight:bold;
    }
</style>
</head>
<body>

<h1>Kids Roulette Picker ??</h1>

<div class="container">
    <div class="box">
        <h2>A</h2>
        <textarea id="groupA" placeholder="One name per line"></textarea>
    </div>

    <div class="box">
        <h2>B</h2>
        <textarea id="groupB" placeholder="One name per line"></textarea>
    </div>

    <div class="box">
        <h2>C</h2>
        <textarea id="groupC" placeholder="One name per line"></textarea>
    </div>

    <div class="box">
        <h2>D</h2>
        <textarea id="groupD" placeholder="One name per line"></textarea>
    </div>
</div>

<div id="wheelContainer">
    <canvas id="wheel" width="500" height="500"></canvas>
    <br>
    <button onclick="spinWheel()">SPIN</button>

    <div id="winner"></div>
</div>

<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const sections = [
    "A","B","C","D",
    "A","B","C","D",
    "A","B","C","D"
];

const colors = [
    "#ff9999","#99ccff","#99ff99","#ffcc99",
    "#ff9999","#99ccff","#99ff99","#ffcc99",
    "#ff9999","#99ccff","#99ff99","#ffcc99"
];

let currentAngle = 0;

function drawWheel() {

    const arcSize = (2 * Math.PI) / sections.length;

    for(let i=0; i<sections.length; i++){

        const angle = i * arcSize;

        ctx.beginPath();
        ctx.moveTo(250,250);
        ctx.arc(250,250,240,angle,angle+arcSize);
        ctx.fillStyle = colors[i];
        ctx.fill();

        ctx.save();

        ctx.translate(250,250);
        ctx.rotate(angle + arcSize/2);

        ctx.fillStyle = "#000";
        ctx.font = "30px Arial";
        ctx.fillText(sections[i],150,10);

        ctx.restore();
    }

    // center circle
    ctx.beginPath();
    ctx.arc(250,250,40,0,2*Math.PI);
    ctx.fillStyle="#fff";
    ctx.fill();

    // pointer
    ctx.beginPath();
    ctx.moveTo(250,10);
    ctx.lineTo(230,50);
    ctx.lineTo(270,50);
    ctx.fillStyle="red";
    ctx.fill();
}

drawWheel();

function spinWheel(){

    const spinAngle = Math.random() * 360 + 1440;

    const finalAngle = currentAngle + spinAngle;

    const duration = 4000;

    const start = performance.now();

    function animate(time){

        const elapsed = time - start;

        const progress = Math.min(elapsed / duration, 1);

        const easeOut = 1 - Math.pow(1 - progress, 3);

        currentAngle = finalAngle * easeOut;

        ctx.clearRect(0,0,500,500);

        ctx.save();
        ctx.translate(250,250);
        ctx.rotate(currentAngle * Math.PI / 180);
        ctx.translate(-250,-250);

        drawWheel();

        ctx.restore();

        if(progress < 1){
            requestAnimationFrame(animate);
        } else {
            pickWinner();
        }
    }

    requestAnimationFrame(animate);
}

function pickWinner(){

    const normalizedAngle =
        (360 - (currentAngle % 360)) % 360;

    const sectionSize = 360 / sections.length;

    const index =
        Math.floor(normalizedAngle / sectionSize);

    const selectedGroup = sections[index];

    let names = [];

    if(selectedGroup === "A"){
        names = document.getElementById("groupA")
            .value.split("\n").filter(n => n.trim() !== "");
    }

    if(selectedGroup === "B"){
        names = document.getElementById("groupB")
            .value.split("\n").filter(n => n.trim() !== "");
    }

    if(selectedGroup === "C"){
        names = document.getElementById("groupC")
            .value.split("\n").filter(n => n.trim() !== "");
    }

    if(selectedGroup === "D"){
        names = document.getElementById("groupD")
            .value.split("\n").filter(n => n.trim() !== "");
    }

    let result = "";

    if(names.length > 0){
        const randomName =
            names[Math.floor(Math.random() * names.length)];

        result =
            `?? Group ${selectedGroup} Winner: ${randomName}`;
    } else {
        result =
            `No names in Group ${selectedGroup}`;
    }

    document.getElementById("winner").innerHTML = result;
}
</script>

</body>
</html>
